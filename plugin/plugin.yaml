name: lbs-vault
version: "1.0.0"
description: >
  LBS password vault tools. List stored handles, request an on-demand secret
  or login through Rubric's native fields, check a request, and run a
  kind-bound root-approved template with credential fields on protected stdin.
  Credential fields are not returned; target output is bounded and exact-match redacted.
  Root terminal access is not isolated; owner-only gateway required.
author: LBS
license: MIT
tags: [security, secrets, vault]
provides_tools:
  - vault_list
  - vault_request
  - vault_status
  - vault_use
